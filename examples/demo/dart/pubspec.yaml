name: demo
description: solid-fuse demo playground app.
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  solid_fuse_cupertino: any # fuse-managed
  solid_fuse_material: any # fuse-managed
  flutter:
    sdk: flutter
  solid_fuse: any

dev_dependencies:
  # The integration test finds Material and Cupertino widgets by type.
  material_ui: ^1.11.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/
